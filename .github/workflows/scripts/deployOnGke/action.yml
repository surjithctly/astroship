name: "Build publish and deploy"
description: "Build project, publish to registry and deploy into the cluster"
inputs:
  workspace:
    description: "Workspace used by terraform"
    required: true
    default: "default"
  cloud-path:
    required: true
    description: "Cloud application path"
  prefix-tag:
    required: false
    description: "Prefixed used in alpha for the tag image"
    default: ""
  gcp-credentials:
    required: true
    description: "GCP services account credentials"
  repository:
    required: true
    description: "Repository name"
  gcp-registry:
    required: true
    description: "GCP registry name"
  gcp-project:
    required: true
    description: "GCP namespace"
  app-project:
    required: true
    description: "Application project name"
  gcp-secret:
    required: true
    description: "GCP secret name"

runs:
  using: "composite"
  steps:
    - name: Get tag
      shell: bash
      id: get_tag
      run: echo TAG=$PREFIX_TAG${{ github.ref_name }} >> $GITHUB_OUTPUT
      env:
        PREFIX_TAG: ${{ inputs.prefix-tag }}

    - name: Get short commit SHA
      shell: bash
      id: get_sha_short
      run: echo SHA_SHORT=$(git rev-parse --short HEAD) >> $GITHUB_OUTPUT

    - name: Apply Kubernetes file
      shell: bash
      working-directory: ${{ inputs.cloud-path }}
      run: |
        gcloud auth configure-docker ${{ inputs.gcp-registry }}
        export $(gcloud secrets versions access latest --secret=${{ inputs.gcp-secret }} |grep -v "^#\|^$" | xargs)
        for f in ./*.yaml ; do
          if [[ $f == *"deployment.yaml" ]]; then
            cat $f | envsubst | kubectl apply -f -
          else
            cat $f | kubectl apply -f -
          fi
        done
      env:
        GCP_CREDENTIALS: ${{ inputs.gcp-credentials }}
        GCP_REGISTRY: ${{ inputs.gcp-registry }}
        GCP_PROJECT: ${{ inputs.gcp-project }}
        APP_PROJECT: ${{ inputs.app-project }}
        REPOSITORY: ${{ inputs.repository }}