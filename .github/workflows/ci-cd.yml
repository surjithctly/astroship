# CI/CD Pipeline for Astro.js Application
name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
env:
  GCP_REGISTRY      : "europe-west1-docker.pkg.dev"
  GCP_PROJECT       : "www-genopsys"
  GCP_REPOSITORY    : "astroship"
  APP_NAME          : "astroship"
  GCP_SECRET        : "astroship-production"
  CLOUD_PATH        : "./cloud/kubernetes"
  PREFIX_TAG        : ""
  IMAGE_NAME        : ${{ github.repository }}

jobs:
  # Job 1: Test and Lint
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: latest

    - name: Install dependencies
      run: |
        if [ -f pnpm-lock.yaml ]; then
          pnpm install --frozen-lockfile
        elif [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Run linting
      run: |
        if npm run lint 2>/dev/null; then
          echo "Linting passed"
        else
          echo "No lint script found, skipping"
        fi

    - name: Run tests
      run: |
        if npm run test 2>/dev/null; then
          echo "Tests passed"
        else
          echo "No test script found, skipping"
        fi

    - name: Build application
      run: |
        if [ -f pnpm-lock.yaml ]; then
          pnpm run build
        else
          npm run build
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: dist/
        retention-days: 1

  # Job 2: Build Docker Images
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Auth GCP
      uses: ./.github/actions/auth-gcp
      with:
        location: 'europe-west1-c'
        service_account_email: 'gh-action@www-genopsys.iam.gserviceaccount.com'
        # gcloud iam workload-identity-pools list --project=www-genopsys --location=global --format="value(displayName)"
        # gcloud iam workload-identity-pools describe bedrock-production --project=www-genopsys --location=global --format="value(displayName)")
        # gcloud iam workload-identity-pools providers list  --location=global --workload-identity-pool=bedrock-production --format="value(name)"
        workload_identity_provider_id: 'projects/823366040477/locations/global/workloadIdentityPools/bedrock-production/providers/github-01'
        cluster_name: 'cluster-1'

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Auth GCP artifact registry
      shell: bash
      run: gcloud auth configure-docker $REGISTRY
      env:
        REGISTRY: ${{ env.GCP_REGISTRY }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.GCP_REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  # Job 3: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.GCP_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Job 5: Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get short commit SHA
      shell: bash
      id: get_sha_short
      run: echo SHA_SHORT=$(git rev-parse --short HEAD) >> $GITHUB_OUTPUT

    - name: Get tag
      shell: bash
      id: get_tag
      run: echo TAG=$PREFIX_TAG${{ github.ref_name }} >> $GITHUB_OUTPUT
      env:
        PREFIX_TAG: ${{ inputs.prefix-tag }}

    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SHA_SHORT: ${{ steps.get_sha_short.outputs.SHA_SHORT }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          Automated release from commit ${{ github.sha }}
          
          Changes in this release:
          - Built from commit: $SHA_SHORT
          - Docker image: ${{ env.GCP_REGISTRY }}/${{ env.IMAGE_NAME }}:$SHA_SHORT
        draft: false
        prerelease: false